<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173a29">
  <meta name="description" content="Ein kleines 3D-Gartenabenteuer mit Wichtel, Münzen und Match-3-Minispiel.">
  <title>Gertrudes Greinwald privater Garten</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./game.bundle.css">
</head>
<body>
  <main id="gameRoot" aria-label="Gertrudes Greinwald privater Garten">
    <canvas id="gameCanvas" aria-label="3D-Garten-Spielwelt"></canvas>
    <div id="gameUi"></div>
    <section id="match3Root" aria-live="polite" hidden></section>
    <div id="loadingScreen" role="status" aria-live="polite">
      <div class="loading-card">
        <strong>Gertrudes Greinwald privater Garten</strong>
        <span id="loadingMessage">Der Garten wird vorbereitet …</span>
        <div class="loading-track"><span></span></div>
      </div>
    </div>
  </main>
  <script type="module" src="./game.bundle.js"></script>
</body>
</html>
